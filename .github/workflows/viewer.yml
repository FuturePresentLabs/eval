name: viewer
on:
  pull_request:
    paths: ["viewer/**", "schema/**", ".github/workflows/viewer.yml"]
  push:
    branches: [main, master]
    paths: ["viewer/**", "schema/**", ".github/workflows/viewer.yml"]
jobs:
  build-and-render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run render:ci
      - uses: actions/upload-artifact@v4
        with:
          name: eval-viewer-and-chart
          path: |
            viewer/dist
            viewer/chart-artifacts
